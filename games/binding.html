<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Isaac Ruffle</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
  </style>
</head>

<body>

<div id="game"></div>

<script src="https://cdn.jsdelivr.net/gh/UncopylockDomainHere/binding/ruffle.js"></script>

<script>
window.RufflePlayer = window.RufflePlayer || {};

window.addEventListener("DOMContentLoaded", () => {
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();

  document.getElementById("game").appendChild(player);

  player.style.width = "100%";
  player.style.height = "100%";

  player.load({
    url: "https://files.catbox.moe/kk84m9.swf"
  });
});
</script>

</body>
</html>
