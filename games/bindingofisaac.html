<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Isaac Ruffle</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

#game {
  width: 100%;
  height: 100%;
}

ruffle-player {
  width: 100% !important;
  height: 100% !important;
  display: block;
}

#ui {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
}

button {
  margin: 5px;
  padding: 8px;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="exportSave()">Export Save</button>
  <input type="file" onchange="importSave(event)">
</div>

<div id="game"></div>

<script src="https://cdn.jsdelivr.net/gh/UncopylockDomainHere/binding/ruffle.js"></script>

<script>
window.RufflePlayer = window.RufflePlayer || {};

window.addEventListener("DOMContentLoaded", () => {
  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();

  document.getElementById("game").appendChild(player);

  player.load({
    url: "https://deft-vacherin-b7fa21.netlify.app/kk84m9.swf"
  });
});


// ✅ EXPORT (IndexedDB + localStorage)
async function exportSave() {
  const data = {
    localStorage: {},
    indexedDB: {}
  };

  // localStorage
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    data.localStorage[key] = localStorage.getItem(key);
  }

  // IndexedDB
  const dbs = await indexedDB.databases();

  for (const dbInfo of dbs) {
    const db = await new Promise(resolve => {
      const req = indexedDB.open(dbInfo.name);
      req.onsuccess = () => resolve(req.result);
    });

    data.indexedDB[dbInfo.name] = {};

    for (const storeName of db.objectStoreNames) {
      const tx = db.transaction(storeName, "readonly");
      const store = tx.objectStore(storeName);

      const allData = await new Promise(resolve => {
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
      });

      data.indexedDB[dbInfo.name][storeName] = allData;
    }
  }

  // Download file
  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: "application/json"
  });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "flash_save.json";
  a.click();
  

  console.log("Save exported!");
}


// ✅ IMPORT

const originalSetItem = localStorage.setItem;

localStorage.setItem = function(key, value) {
  console.log("Game saved:", key);
  originalSetItem.apply(this, arguments);
};
  
async function importSave(event) {
  const file = event.target.files[0];
  const text = await file.text();
  const data = JSON.parse(text);

  // Restore localStorage
  for (const key in data.localStorage) {
    localStorage.setItem(key, data.localStorage[key]);
  }

  // Restore IndexedDB (basic overwrite)
  for (const dbName in data.indexedDB) {
    const db = await new Promise(resolve => {
      const req = indexedDB.open(dbName);
      req.onsuccess = () => resolve(req.result);
    });

    for (const storeName in data.indexedDB[dbName]) {
      const tx = db.transaction(storeName, "readwrite");
      const store = tx.objectStore(storeName);

      for (const item of data.indexedDB[dbName][storeName]) {
        store.put(item);
      }
    }
  }

  alert("Save imported! Refresh the page.");
}
</script>

</body>
</html>
