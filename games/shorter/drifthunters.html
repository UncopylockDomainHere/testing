<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>N:ZP</title>
</head>
<body>

<script>
// URL to your raw HTML file
const GAME_URL = "https://cdn.jsdelivr.net/gh/UncopylockDomainHere/testing/games/drifthunters.html";

// Create button
const btn = document.createElement("button");
btn.innerText = "Play Game (Full Screen)";

// Style (optional)
Object.assign(btn.style, {
  position: "fixed",
  top: "50%",
  left: "50%",
  transform: "translate(-50%, -50%)",
  padding: "14px 20px",
  fontSize: "18px",
  cursor: "pointer",
  zIndex: "9999",
  background: "#111",
  color: "#fff",
  border: "none",
  borderRadius: "10px"
});

// On click → fetch HTML → open new tab → inject it
btn.addEventListener("click", async () => {
  try {
    const res = await fetch(GAME_URL);
    const htmlText = await res.text();

    // Open a blank tab
    const newTab = window.open("", "_blank");

    // Write the fetched HTML into it
    newTab.document.open();
    newTab.document.write(htmlText);
    newTab.document.close();

  } catch (err) {
    alert("Failed to load game.");
    console.error(err);
  }
});

// Add button to page
document.body.appendChild(btn);
</script>

</body>
</html>
