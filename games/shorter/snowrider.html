<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snow Rider 3D</title>
</head>
<body>

<script>
const GAME_URL = "https://cdn.jsdelivr.net/gh/UncopylockDomainHere/testing/games/snowrider.html";

// Create button
const btn = document.createElement("button");
btn.innerText = "Play Game (Full Screen)";

// Style
Object.assign(btn.style, {
  position: "fixed",
  top: "50%",
  left: "50%",
  transform: "translate(-50%, -50%)",
  padding: "14px 20px",
  fontSize: "18px",
  cursor: "pointer",
  zIndex: "9999",
  background: "#111",
  color: "#fff",
  border: "none",
  borderRadius: "10px"
});

// Click → open game normally (scripts will work)
btn.addEventListener("click", () => {
  window.open(GAME_URL, "_blank");
});

// Add button
document.body.appendChild(btn);
</script>

</body>
</html>
