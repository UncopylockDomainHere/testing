<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snow Rider 3D</title>
</head>
<body>

<script>
// Create button
const btn = document.createElement("button");
btn.innerText = "Open HTML Page";

// Apply your exact styling
Object.assign(btn.style, {
  position: "fixed",
  top: "50%",
  left: "50%",
  transform: "translate(-50%, -50%)",
  padding: "14px 20px",
  fontSize: "18px",
  cursor: "pointer",
  zIndex: "9999",
  background: "#111",
  color: "#fff",
  border: "none",
  borderRadius: "10px"
});

// Click event
btn.onclick = () => {
  const newWindow = window.open("about:blank", "_blank");

  // 🔁 Replace this with your .html file
  const htmlURL = "https://cdn.jsdelivr.net/gh/UncopylockDomainHere/testing/games/snowrider.html";

  fetch(htmlURL)
    .then(res => res.text())
    .then(html => {
      newWindow.document.open();
      newWindow.document.write(html);
      newWindow.document.close();
    })
    .catch(err => {
      newWindow.document.write("<h1>Failed to load HTML</h1>");
      console.error(err);
    });
};

// Add button to page
document.body.appendChild(btn);
</script>

</body>
</html>
