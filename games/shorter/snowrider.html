<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Snow Rider 3D</title>
</head>
<body>

<script>
const GAME_URL = "https://cdn.jsdelivr.net/gh/UncopylockDomainHere/testing/games/snowrider.html";

const btn = document.createElement("button");
btn.innerText = "Play Game (Forced HTML Load)";

Object.assign(btn.style, {
  position: "fixed",
  top: "50%",
  left: "50%",
  transform: "translate(-50%, -50%)",
  padding: "14px 20px",
  fontSize: "18px",
  cursor: "pointer",
  zIndex: "9999",
  background: "#111",
  color: "#fff",
  border: "none",
  borderRadius: "10px"
});

btn.addEventListener("click", async () => {
  try {
    const res = await fetch(GAME_URL);
    let html = await res.text();

    // Inject <base> so relative paths work
    const baseTag = `<base href="${GAME_URL}">`;

    if (html.includes("<head>")) {
      html = html.replace("<head>", `<head>${baseTag}`);
    } else {
      html = baseTag + html;
    }

    const newTab = window.open("", "_blank");

    newTab.document.open();
    newTab.document.write(html);
    newTab.document.close();

  } catch (err) {
    console.error(err);
    alert("Failed to load game.");
  }
});

document.body.appendChild(btn);
</script>

</body>
</html>
